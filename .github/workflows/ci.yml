name: CI/CD Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test & Validate (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install ruff==0.6.3 bandit==1.7.9

      - name: Lint with ruff
        run: ruff check core/ strategy/ evolution/ treasury/ monitoring/ config/ tests/ scripts/ || true

      - name: Security scan with bandit
        run: bandit -r core/ strategy/ evolution/ treasury/ monitoring/ config/ -ll -ii || true

      - name: Run Full Test Suite (33/33 Suites)
        run: python3 tests/run_all_tests.py

      - name: Run Deterministic Quality Gates
        run: python3 scripts/gates/run_all_quality_gates.py
