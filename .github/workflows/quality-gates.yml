name: 🛡️ Quality & Security Gates

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  audit-gates:
    name: Central Quality & Security Gates
    uses: 70gurupia/quality-gates/.github/workflows/reusable-gates.yml@main
    with:
      max_complexity: '10'
      check_secrets: true
      check_dependencies: true
      check_cleanliness: true
      post_pr_comment: true
